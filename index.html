<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Jura Events</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
    header{background:linear-gradient(135deg,#16213e,#1a6b3a);padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #2ecc71;position:sticky;top:0;z-index:100}
    header h1{font-size:1.2rem;color:#fff}
    header .sub{font-size:0.75rem;color:#aaa}
    .badge{background:#2ecc71;color:#111;padding:4px 12px;border-radius:20px;font-size:0.75rem;margin-left:auto;font-weight:bold;cursor:pointer;border:none;white-space:nowrap}
    .badge:hover{background:#27ae60}
    .container{max-width:860px;margin:0 auto;padding:20px 14px}
    .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:0.82rem;font-weight:bold;transition:all .2s}
    .btn-green{background:#2ecc71;color:#111}.btn-green:hover{background:#27ae60}
    .btn-outline{background:transparent;color:#2ecc71;border:1px solid #2ecc71}.btn-outline:hover{background:#2ecc71;color:#111}
    .btn-red{background:#e74c3c;color:#fff}.btn-red:hover{background:#c0392b}
    .btn-sm{padding:4px 10px;font-size:0.73rem}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;align-items:center;justify-content:center;padding:16px}
    .modal-bg.open{display:flex}
    .modal{background:#16213e;border-radius:14px;padding:22px;width:100%;max-width:540px;border:1px solid #2ecc71;max-height:90vh;overflow-y:auto}
    .modal h2{font-size:1.05rem;color:#2ecc71;margin-bottom:14px}
    label{font-size:0.78rem;color:#aaa;display:block;margin:10px 0 3px}
    input,textarea,select{width:100%;background:#0f3460;border:1px solid #333;border-radius:7px;padding:8px 11px;color:#eee;font-size:0.82rem;outline:none}
    input:focus,textarea:focus{border-color:#2ecc71}
    .dates-list .date-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
    .dates-list .date-row input{flex:1}
    .add-date-btn{margin-top:6px;font-size:0.76rem;color:#2ecc71;background:none;border:1px dashed #2ecc71;border-radius:6px;padding:4px 10px;cursor:pointer;width:100%}
    .form-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}
    .event-card{background:#16213e;border-radius:12px;border-left:4px solid #2ecc71;margin-bottom:14px;overflow:hidden}
    .event-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px}
    .event-emoji{font-size:1.9em;flex-shrink:0}
    .event-info{flex:1;min-width:0}
    .event-title{font-size:0.98rem;font-weight:bold;color:#fff}
    .event-meta{font-size:0.72rem;color:#888;margin-top:2px}
    .event-btns{display:flex;gap:6px;flex-shrink:0}
    .event-body{display:none;padding:0 14px 14px}
    .event-body.open{display:block}
    .event-desc{font-size:0.8rem;color:#bbb;margin-bottom:10px;background:#0f3460;padding:9px;border-radius:7px;line-height:1.5}
    .date-slot{background:#0f3460;border-radius:8px;padding:10px 12px;margin-bottom:8px}
    .date-slot-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
    .date-label{font-size:0.83rem;font-weight:bold;color:#2ecc71;flex:1}
    .reg-count{font-size:0.72rem;color:#888}
    .prog{height:4px;background:#1a1a2e;border-radius:2px;margin:4px 0 8px}
    .prog-fill{height:100%;background:#2ecc71;border-radius:2px;transition:width .3s}
    .reg-item{display:flex;align-items:center;gap:6px;font-size:0.76rem;color:#ccc;padding:3px 0;border-bottom:1px solid #1a1a2e}
    .reg-item:last-child{border-bottom:none}
    .reg-del{background:none;border:none;color:#e74c3c;cursor:pointer;font-size:0.8rem;padding:1px 4px}
    .cal-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
    .cal-btn{font-size:0.7rem;padding:3px 9px;border-radius:6px;border:1px solid #3498db;color:#3498db;background:none;cursor:pointer;text-decoration:none;display:inline-block}
    .cal-btn:hover{background:#3498db;color:#fff}
    .cal-ics{border-color:#9b59b6;color:#9b59b6}
    .cal-ics:hover{background:#9b59b6;color:#fff}
    .register-btn{margin-top:10px}
    .date-checkboxes .date-check{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:0.82rem}
    .date-check input[type=checkbox]{width:auto;accent-color:#2ecc71}
    .empty{text-align:center;padding:60px 20px;color:#555}
    .empty .big{font-size:3em;margin-bottom:12px}
    .admin-bar{background:#0f3460;padding:8px 20px;font-size:0.76rem;color:#888;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333}
    .admin-bar span{color:#2ecc71}
    .toast{position:fixed;bottom:20px;right:20px;background:#2ecc71;color:#111;padding:10px 18px;border-radius:10px;font-size:0.83rem;font-weight:bold;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:280px}
    .toast.show{opacity:1}
    .loading{text-align:center;padding:40px;color:#888;font-size:0.85rem}
    .spinner{display:inline-block;width:22px;height:22px;border:3px solid #333;border-top-color:#2ecc71;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .config-box{background:#0f3460;border-radius:8px;padding:12px;margin-bottom:16px;font-size:0.78rem;color:#888;border:1px solid #333}
    .config-box strong{color:#f39c12}
    @media(max-width:480px){.event-btns{flex-direction:column}.event-header{flex-wrap:wrap}}
  </style>
</head>
<body>

<header>
  <div style="font-size:1.8em">🎉</div>
  <div>
    <h1>Jura Events</h1>
    <div class="sub">Inscriptions partagées en ligne</div>
  </div>
  <button class="badge" onclick="toggleAdmin()">⚙️ Admin</button>
</header>

<div id="admin-bar" class="admin-bar" style="display:none">
  ⚙️ Mode admin — <span>Vous pouvez créer et gérer les événements</span>
  <button class="btn btn-sm btn-green" onclick="openCreate()" style="margin-left:auto">+ Nouvel événement</button>
</div>

<div class="container">
  <div id="loading" class="loading"><span class="spinner"></span>Chargement des événements…</div>
  <div id="events-list" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">📅</div>
    <p>Aucun événement pour l'instant.</p>
    <p style="margin-top:6px;font-size:0.78rem">Active le mode admin pour en créer un !</p>
  </div>
</div>

<!-- MODAL CREATE/EDIT -->
<div id="modal-event" class="modal-bg">
  <div class="modal">
    <h2 id="modal-title">✨ Nouvel événement</h2>
    <label>Emoji</label><input id="f-emoji" maxlength="4" value="🎉" style="width:70px">
    <label>Titre *</label><input id="f-title" placeholder="Ex: Apéro au lac">
    <label>Description</label><textarea id="f-desc" rows="2" placeholder="Infos sur l'événement…"></textarea>
    <label>Lieu</label><input id="f-location" placeholder="Ex: Morez, Jura">
    <label>Dates proposées *</label>
    <div class="dates-list" id="dates-list"></div>
    <button class="add-date-btn" onclick="addDateRow()">+ Ajouter une date</button>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('modal-event')">Annuler</button>
      <button class="btn btn-green" onclick="saveEvent()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL REGISTER -->
<div id="modal-register" class="modal-bg">
  <div class="modal">
    <h2>✋ S'inscrire</h2>
    <label>Prénom *</label><input id="r-first" placeholder="Jean">
    <label>Nom *</label><input id="r-last" placeholder="Dupont">
    <label>Email (optionnel)</label><input id="r-email" type="email" placeholder="jean@exemple.com">
    <label>Date(s) *</label>
    <div class="date-checkboxes" id="r-dates"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('modal-register')">Annuler</button>
      <button class="btn btn-green" onclick="submitReg()">✅ S'inscrire</button>
    </div>
  </div>
</div>

<!-- MODAL ADMIN -->
<div id="modal-admin" class="modal-bg">
  <div class="modal">
    <h2>🔑 Accès administrateur</h2>
    <label>Mot de passe</label>
    <input type="password" id="admin-pw" placeholder="Entrez le mot de passe" onkeydown="if(event.key==='Enter')checkAdmin()">
    <div style="font-size:0.73rem;color:#666;margin-top:5px">Par défaut : <code style="color:#2ecc71">jura2026</code></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('modal-admin')">Annuler</button>
      <button class="btn btn-green" onclick="checkAdmin()">Entrer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// ── CONFIG ────────────────────────────────────────────────
const ADMIN_PW = 'jura2026';
const BLOB_BASE = 'https://jsonblob.com/api/jsonBlob';
const BLOB_ID_KEY = 'jura_blob_id';

// Crée un nouveau blob si pas d'ID stocké
async function getBlobId() {
  let id = localStorage.getItem(BLOB_ID_KEY);
  if (id) return id;
  // Premier lancement : créer un blob partagé
  const res = await fetch(BLOB_BASE, {
    method: 'POST',
    headers: {'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({events:[], createdAt: Date.now()})
  });
  const loc = res.headers.get('location') || res.headers.get('Location');
  const newId = loc ? loc.split('/').pop() : null;
  if (newId) {
    localStorage.setItem(BLOB_ID_KEY, newId);
    return newId;
  }
  throw new Error('Impossible de créer le blob de données');
}

async function loadData() {
  const id = await getBlobId();
  const res = await fetch(`${BLOB_BASE}/${id}`, {headers:{Accept:'application/json'}});
  return res.json();
}

async function saveData(data) {
  const id = await getBlobId();
  await fetch(`${BLOB_BASE}/${id}`, {
    method: 'PUT',
    headers: {'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify(data)
  });
}

// ── STATE ─────────────────────────────────────────────────
let isAdmin = false;
let editingId = null;
let registerEventId = null;
let appData = {events: []};

// ── UTILS ─────────────────────────────────────────────────
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = err ? '#e74c3c' : '#2ecc71';
  el.style.color = err ? '#fff' : '#111';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2800);
}

function formatDate(date, time) {
  if (!date) return '?';
  const d = new Date(date + 'T00:00');
  const label = d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'});
  return label + (time ? ' à ' + time : '');
}

function googleCalUrl(title, date, time, location) {
  const dt = date.replace(/-/g,'');
  const t = (time||'').replace(':','');
  const start = t ? `${dt}T${t}00` : dt;
  const end = t ? `${dt}T${String(parseInt(t.slice(0,2))+2).padStart(2,'0')}${t.slice(2)}00` : dt;
  return 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
    action:'TEMPLATE', text:title,
    dates: start+'/'+end,
    location: location||''
  });
}

function downloadICS(title, date, time, location) {
  const d = new Date(date+'T'+(time||'00:00')+':00');
  const fmt = x => x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const end = new Date(d); end.setHours(end.getHours()+2);
  const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${fmt(d)}\nDTEND:${fmt(end)}\nSUMMARY:${title}\nLOCATION:${location||''}\nEND:VEVENT\nEND:VCALENDAR`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download = title.replace(/\s+/g,'-')+'.ics';
  a.click();
}

// ── MODAL ─────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── ADMIN ─────────────────────────────────────────────────
function toggleAdmin() {
  if (isAdmin) { isAdmin = false; document.getElementById('admin-bar').style.display='none'; render(); return; }
  document.getElementById('admin-pw').value = '';
  openModal('modal-admin');
}
function checkAdmin() {
  if (document.getElementById('admin-pw').value === ADMIN_PW) {
    isAdmin = true; closeModal('modal-admin');
    document.getElementById('admin-bar').style.display = 'flex';
    toast('✅ Mode admin activé !'); render();
  } else {
    document.getElementById('admin-pw').style.borderColor = '#e74c3c';
    setTimeout(() => document.getElementById('admin-pw').style.borderColor='#333', 1500);
  }
}

// ── CREATE / EDIT ─────────────────────────────────────────
function openCreate(evId=null) {
  editingId = evId;
  document.getElementById('modal-title').textContent = evId ? '✏️ Modifier' : '✨ Nouvel événement';
  document.getElementById('dates-list').innerHTML = '';
  if (evId) {
    const ev = appData.events.find(e=>e.id===evId);
    if (ev) {
      document.getElementById('f-emoji').value = ev.emoji||'🎉';
      document.getElementById('f-title').value = ev.title;
      document.getElementById('f-desc').value = ev.desc||'';
      document.getElementById('f-location').value = ev.location||'';
      (ev.dates||[]).forEach(d => addDateRow(d.date,d.time,d.max));
    }
  } else {
    document.getElementById('f-emoji').value='🎉';
    document.getElementById('f-title').value='';
    document.getElementById('f-desc').value='';
    document.getElementById('f-location').value='';
    addDateRow();
  }
  openModal('modal-event');
}

function addDateRow(date='',time='',max='') {
  const row = document.createElement('div');
  row.className = 'date-row';
  row.innerHTML = `<input type="date" value="${date}"><input type="time" value="${time}" style="width:110px"><input type="number" value="${max||''}" placeholder="Max" style="width:75px" min="1"><button class="btn btn-red btn-sm" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('dates-list').appendChild(row);
}

async function saveEvent() {
  const title = document.getElementById('f-title').value.trim();
  if (!title) { toast('⚠️ Titre obligatoire', true); return; }
  const rows = document.querySelectorAll('#dates-list .date-row');
  const dates = [];
  rows.forEach(row => {
    const [d,t,m] = row.querySelectorAll('input');
    if (d.value) dates.push({id:uid(), date:d.value, time:t.value, max:parseInt(m.value)||0, registrations:[]});
  });
  if (!dates.length) { toast('⚠️ Ajoutez au moins une date', true); return; }

  if (editingId) {
    const idx = appData.events.findIndex(e=>e.id===editingId);
    if (idx>=0) {
      const existing = appData.events[idx].dates||[];
      dates.forEach(d => { const prev=existing.find(e=>e.date===d.date&&e.time===d.time); if(prev) d.registrations=prev.registrations; });
      appData.events[idx] = {...appData.events[idx], emoji:document.getElementById('f-emoji').value||'🎉', title, desc:document.getElementById('f-desc').value, location:document.getElementById('f-location').value, dates};
    }
  } else {
    appData.events.push({id:uid(), emoji:document.getElementById('f-emoji').value||'🎉', title, desc:document.getElementById('f-desc').value, location:document.getElementById('f-location').value, dates, createdAt:Date.now()});
  }
  closeModal('modal-event');
  toast('💾 Sauvegarde…');
  await saveData(appData);
  render();
  toast(editingId ? '✅ Mis à jour !' : '🎉 Événement créé !');
}

async function deleteEvent(id) {
  if (!confirm('Supprimer cet événement ?')) return;
  appData.events = appData.events.filter(e=>e.id!==id);
  await saveData(appData);
  render();
  toast('🗑️ Supprimé');
}

function toggleBody(id) {
  document.getElementById('body-'+id).classList.toggle('open');
}

// ── REGISTER ─────────────────────────────────────────────
function openRegister(evId) {
  registerEventId = evId;
  const ev = appData.events.find(e=>e.id===evId);
  if (!ev) return;
  document.getElementById('r-first').value='';
  document.getElementById('r-last').value='';
  document.getElementById('r-email').value='';
  const cont = document.getElementById('r-dates');
  cont.innerHTML = ev.dates.map(d => {
    const full = d.max && d.registrations.length >= d.max;
    return `<div class="date-check"><input type="checkbox" id="dc-${d.id}" value="${d.id}" ${full?'disabled':''}><label for="dc-${d.id}" style="color:${full?'#555':'#eee'}">${formatDate(d.date,d.time)} — ${d.registrations.length}${d.max?'/'+d.max:''} inscrits${full?' <span style="color:#e74c3c">(complet)</span>':''}</label></div>`;
  }).join('');
  openModal('modal-register');
}

async function submitReg() {
  const fn = document.getElementById('r-first').value.trim();
  const ln = document.getElementById('r-last').value.trim();
  const email = document.getElementById('r-email').value.trim();
  if (!fn||!ln) { toast('⚠️ Prénom et nom obligatoires', true); return; }
  const checked = [...document.querySelectorAll('#r-dates input:checked')].map(i=>i.value);
  if (!checked.length) { toast('⚠️ Choisissez au moins une date', true); return; }
  const ev = appData.events.find(e=>e.id===registerEventId);
  if (!ev) return;
  checked.forEach(dateId => {
    const d = ev.dates.find(x=>x.id===dateId);
    if (d && !(d.max && d.registrations.length >= d.max)) {
      d.registrations.push({id:uid(), name:fn+' '+ln, email, at:Date.now()});
    }
  });
  closeModal('modal-register');
  toast('💾 Inscription en cours…');
  await saveData(appData);
  render();
  toast(`✅ ${fn}, vous êtes inscrit(e) !`);
}

async function deleteReg(evId, dateId, regId) {
  const ev = appData.events.find(e=>e.id===evId);
  if (!ev) return;
  const d = ev.dates.find(x=>x.id===dateId);
  if (d) d.registrations = d.registrations.filter(r=>r.id!==regId);
  await saveData(appData);
  render();
  toast('🗑️ Inscription supprimée');
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  const list = document.getElementById('events-list');
  const empty = document.getElementById('empty');
  document.getElementById('loading').style.display = 'none';
  if (!appData.events.length) {
    list.style.display = 'none'; empty.style.display = 'block'; return;
  }
  empty.style.display = 'none'; list.style.display = 'block';
  list.innerHTML = appData.events.map(ev => {
    const total = ev.dates.reduce((s,d)=>s+d.registrations.length, 0);
    const datesHtml = ev.dates.map(d => {
      const pct = d.max ? Math.min(100, Math.round(d.registrations.length/d.max*100)) : 0;
      const regsHtml = d.registrations.length
        ? d.registrations.map(r=>`<div class="reg-item"><span style="flex:1">👤 ${r.name}</span><span style="color:#888;font-size:0.7rem">${r.email||''}</span>${isAdmin?`<button class="reg-del" onclick="deleteReg('${ev.id}','${d.id}','${r.id}')">✕</button>`:''}</div>`).join('')
        : '<div style="font-size:0.73rem;color:#555;padding:3px 0">Aucune inscription</div>';
      return `<div class="date-slot">
        <div class="date-slot-head"><span class="date-label">📅 ${formatDate(d.date,d.time)}</span><span class="reg-count">${d.registrations.length}${d.max?'/'+d.max:''} inscrits</span></div>
        ${d.max?`<div class="prog"><div class="prog-fill" style="width:${pct}%"></div></div>`:''}
        ${regsHtml}
        <div class="cal-row">
          <a class="cal-btn" href="${googleCalUrl(ev.title,d.date,d.time,ev.location)}" target="_blank">📅 Google Cal</a>
          <button class="cal-btn cal-ics" onclick="downloadICS('${ev.title.replace(/'/g,"\\'")}','${d.date}','${d.time||''}','${(ev.location||'').replace(/'/g,"\\'")}')">📥 .ics</button>
        </div>
      </div>`;
    }).join('');
    return `<div class="event-card">
      <div class="event-header" onclick="toggleBody('${ev.id}')">
        <span class="event-emoji">${ev.emoji||'🎉'}</span>
        <div class="event-info">
          <div class="event-title">${ev.title}</div>
          <div class="event-meta">${ev.dates.length} date(s) · ${total} inscription(s)${ev.location?' · 📍'+ev.location:''}</div>
        </div>
        <div class="event-btns" onclick="event.stopPropagation()">
          <button class="btn btn-green btn-sm" onclick="openRegister('${ev.id}')">✋ S'inscrire</button>
          ${isAdmin?`<button class="btn btn-outline btn-sm" onclick="openCreate('${ev.id}')">✏️</button><button class="btn btn-red btn-sm" onclick="deleteEvent('${ev.id}')">🗑️</button>`:''}
        </div>
      </div>
      <div class="event-body" id="body-${ev.id}">
        ${ev.desc?`<div class="event-desc">${ev.desc}</div>`:''}
        ${datesHtml}
      </div>
    </div>`;
  }).join('');
}

// ── INIT ──────────────────────────────────────────────────
async function init() {
  try {
    appData = await loadData();
    if (!appData.events) appData.events = [];
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML = `<div style="color:#e74c3c">❌ Erreur de chargement : ${e.message}</div>`;
  }
}

init();

// Rafraîchit toutes les 30 secondes
setInterval(async () => {
  try {
    const fresh = await loadData();
    if (JSON.stringify(fresh) !== JSON.stringify(appData)) {
      appData = fresh;
      if (!appData.events) appData.events = [];
      render();
    }
  } catch(e) {}
}, 30000);
</script>
