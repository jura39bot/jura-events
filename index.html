    body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(46,204,113,.06) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(58,155,213,.04) 0%,transparent 50%);z-index:0;pointer-events:none}

    header{background:rgba(13,13,26,.92);backdrop-filter:blur(20px);padding:0 24px;height:64px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
    .logo-img{width:38px;height:38px;border-radius:50%;border:2px solid var(--g);object-fit:cover;box-shadow:0 0 14px rgba(46,204,113,.35)}
    header h1{font-size:1.15rem;font-weight:800;color:#fff;letter-spacing:-.02em}
    header h1 span{color:var(--g)}
    .header-sub{font-size:0.68rem;color:var(--muted);margin-top:1px}
    .hactions{margin-left:auto}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:100px;font-size:0.77rem;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif;white-space:nowrap}
    .pill-g{background:var(--g);color:#050c08}.pill-g:hover{background:var(--g2);transform:translateY(-1px);box-shadow:0 4px 14px rgba(46,204,113,.3)}
    .pill-o{background:transparent;color:var(--g);border:1.5px solid var(--g)}.pill-o:hover{background:rgba(46,204,113,.1)}
    .pill-r{background:rgba(231,76,60,.12);color:var(--red);border:1.5px solid rgba(231,76,60,.3)}.pill-r:hover{background:rgba(231,76,60,.22)}

    .admin-bar{background:rgba(46,204,113,.06);border-bottom:1px solid rgba(46,204,113,.15);padding:9px 24px;display:flex;align-items:center;gap:10px;font-size:0.75rem;color:var(--muted);position:relative;z-index:1}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);animation:pulse 2s infinite;flex-shrink:0}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    .container{max-width:960px;margin:0 auto;padding:28px 16px;position:relative;z-index:1}

    .event-card{background:var(--card);border-radius:18px;border:1px solid var(--border);margin-bottom:16px;overflow:hidden;transition:border-color .25s,box-shadow .25s}
    .event-card:hover{border-color:rgba(46,204,113,.25);box-shadow:0 8px 40px rgba(0,0,0,.4)}
    .event-header{padding:18px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;user-select:none}
    .event-emoji{font-size:2em;width:52px;height:52px;background:var(--card2);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
    .event-title{font-size:1.05rem;font-weight:700;color:#fff;margin-bottom:4px}
    .event-tags{display:flex;flex-wrap:wrap;gap:5px}
    .tag{display:inline-flex;align-items:center;gap:4px;font-size:0.66rem;padding:2px 9px;border-radius:100px;font-weight:500;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
    .tag.g{background:rgba(46,204,113,.1);border-color:rgba(46,204,113,.25);color:var(--g)}
    .tag.b{background:rgba(58,155,213,.1);border-color:rgba(58,155,213,.25);color:var(--blue)}
    .tag.o{background:rgba(243,156,18,.1);border-color:rgba(243,156,18,.25);color:var(--orange)}
    .event-actions{display:flex;gap:7px;flex-shrink:0;align-items:center}
    .event-body{display:none;padding:0 20px 20px;border-top:1px solid var(--border)}
    .event-body.open{display:block}

    .share-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:10px;padding:10px 14px;margin:14px 0;border:1px solid var(--border)}
    .share-url{font-size:0.71rem;color:var(--g);flex:1;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .copy-btn{font-size:0.71rem;background:var(--g);color:#050c08;border:none;border-radius:7px;padding:5px 12px;cursor:pointer;font-weight:700;flex-shrink:0;font-family:'Inter',sans-serif}
    .copy-btn:hover{background:var(--g2)}

    .doodle-wrap{overflow-x:auto;margin:14px 0;border-radius:12px;border:1px solid var(--border)}
    .doodle-table{border-collapse:collapse;width:100%;min-width:380px}
    .doodle-table th{background:rgba(26,26,53,.8);color:var(--muted);font-size:0.68rem;font-weight:600;padding:10px 12px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;text-transform:uppercase;letter-spacing:.05em}
    .doodle-table th.nc{text-align:left;color:var(--g);font-size:0.72rem}
    .doodle-table td{border-bottom:1px solid rgba(42,42,74,.4);padding:9px 10px;text-align:center;font-size:0.8rem;vertical-align:middle}
    .doodle-table td.nc{text-align:left}
    .doodle-table tr:last-child td{border-bottom:none}
    .doodle-table tr:hover td{background:rgba(255,255,255,.02)}
    .pname{font-weight:500;color:var(--text);font-size:0.82rem}
    .pfam{font-size:0.67rem;color:var(--muted)}
    .totrow td{background:rgba(46,204,113,.05);border-top:1px solid rgba(46,204,113,.15);font-weight:600}
    .totrow td.nc{color:var(--muted);font-size:0.73rem}
    .cy{color:var(--g)}.cm{color:var(--orange)}.cn{color:var(--red)}
    .stag{font-size:0.61rem;background:rgba(58,155,213,.15);color:var(--blue);border:1px solid rgba(58,155,213,.2);border-radius:4px;padding:1px 4px;margin-left:2px}
    .del-btn{background:none;border:none;color:rgba(231,76,60,.4);cursor:pointer;font-size:0.75rem;padding:2px 4px;transition:color .2s}.del-btn:hover{color:var(--red)}

    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(6px)}
    .modal-bg.open{display:flex}
    .modal{background:var(--card);border-radius:20px;padding:26px;width:100%;max-width:560px;border:1px solid var(--border);max-height:92vh;overflow-y:auto;box-shadow:0 32px 80px rgba(0,0,0,.7)}
    .modal h2{font-size:1.1rem;font-weight:700;color:var(--g);margin-bottom:18px}
    label{font-size:0.71rem;color:var(--muted);display:block;margin:12px 0 4px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
    input,textarea{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:9px 13px;color:var(--text);font-size:0.83rem;outline:none;font-family:'Inter',sans-serif;transition:border-color .2s}
    input:focus,textarea:focus{border-color:var(--g)}
    .row2{display:flex;gap:10px}.row2>*{flex:1}
    .date-row{display:flex;gap:6px;align-items:center;margin-bottom:7px;background:var(--card2);padding:8px 10px;border-radius:10px;border:1px solid var(--border)}
    .date-row input{background:transparent;border:none;padding:4px;flex:1}
    .date-row input:focus{border:none;box-shadow:none}
    .add-date-btn{width:100%;margin-top:8px;padding:9px;font-size:0.76rem;color:var(--g);background:rgba(46,204,113,.05);border:1.5px dashed rgba(46,204,113,.35);border-radius:10px;cursor:pointer;font-weight:600;transition:all .2s;font-family:'Inter',sans-serif}
    .add-date-btn:hover{background:rgba(46,204,113,.12);border-color:var(--g)}
    .form-actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end;padding-top:16px;border-top:1px solid var(--border)}
    .slabel{font-size:0.73rem;color:var(--g);font-weight:700;margin:16px 0 8px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;gap:6px}

    .drr{background:var(--card2);border-radius:12px;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--border);transition:border-color .25s}
    .drr.answered{border-color:rgba(46,204,113,.3);background:rgba(46,204,113,.03)}
    .drr-label{font-size:0.84rem;color:var(--text);font-weight:600;margin-bottom:8px}
    .abtns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .abtn{padding:6px 14px;border-radius:9px;border:1.5px solid var(--border);cursor:pointer;font-size:0.77rem;font-weight:600;background:var(--bg);color:var(--muted);transition:all .2s;font-family:'Inter',sans-serif}
    .abtn.yes{border-color:rgba(46,204,113,.4);color:var(--g)}.abtn.yes.sel{background:var(--g);color:#050c08;border-color:var(--g)}
    .abtn.maybe{border-color:rgba(243,156,18,.4);color:var(--orange)}.abtn.maybe.sel{background:var(--orange);color:#111;border-color:var(--orange)}
    .abtn.no{border-color:rgba(231,76,60,.4);color:var(--red)}.abtn.no.sel{background:var(--red);color:#fff;border-color:var(--red)}
    .extra{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:0.76rem;color:var(--muted)}
    .extra label{text-transform:none;letter-spacing:0;font-weight:400;margin:0;display:flex;align-items:center;gap:6px;cursor:pointer}
    .extra input[type=number]{width:68px;padding:5px 8px;margin-left:4px}
    .extra input[type=checkbox]{width:auto;accent-color:var(--g)}

    .cal-section{margin-top:12px}
    .cal-row2{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
    .cal-lbl{font-size:0.72rem;color:var(--muted);min-width:100px}
    .cbtn{font-size:0.69rem;padding:3px 10px;border-radius:6px;border:1px solid rgba(58,155,213,.4);color:var(--blue);background:rgba(58,155,213,.07);cursor:pointer;text-decoration:none;display:inline-block;font-weight:500;transition:all .2s;font-family:'Inter',sans-serif}
    .cbtn:hover{background:var(--blue);color:#fff}
    .cbtn.ics{border-color:rgba(155,89,182,.4);color:#9b59b6;background:rgba(155,89,182,.07)}.cbtn.ics:hover{background:#9b59b6;color:#fff}

    .loading{text-align:center;padding:70px 20px;color:var(--muted);font-size:0.85rem;position:relative;z-index:1}
    .spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--g);border-radius:50%;animation:spin .8s linear infinite;margin-right:10px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty{text-align:center;padding:80px 20px;color:var(--muted);position:relative;z-index:1}
    .empty .big{font-size:3.5em;margin-bottom:14px;opacity:.4}
    .empty p{font-size:0.85rem;line-height:1.6}

    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:12px;font-size:0.8rem;font-weight:600;z-index:999;opacity:0;transition:all .3s;pointer-events:none;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
    .toast.show{opacity:1;transform:translateY(-4px)}
    .toast.ok{background:rgba(46,204,113,.95);color:#050c08}
    .toast.err{background:rgba(231,76,60,.95);color:#fff}

    @media(max-width:540px){.event-actions{flex-direction:column;gap:5px}.row2{flex-direction:column}}
  </style>
</head>

      <div><label>🛏️ Capa. nuitées</label><input id="f-capacity" type="number" min="0" placeholder="0 = illimité"></div>
    </div>
    <div class="slabel">📅 Dates proposées</div>
    <div id="dates-list"></div>
    <button class="add-date-btn" onclick="addDateRow()">+ Ajouter une date / période</button>
    <div class="form-actions">
      <button class="pill pill-o" onclick="closeModal('modal-event')">Annuler</button>
      <button class="pill pill-g" onclick="saveEvent()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL RESPOND -->
<div id="modal-respond" class="modal-bg">
  <div class="modal">
    <h2>✋ Ma réponse</h2>
    <div class="row2">
      <div><label>Prénom *</label><input id="r-first" placeholder="Jean"></div>
      <div><label>Nom *</label><input id="r-last" placeholder="Dupont"></div>
    </div>
    <div class="row2">
      <div><label>Famille / Groupe</label><input id="r-family" placeholder="Famille Dupont"></div>
      <div><label>Email (optionnel)</label><input id="r-email" type="email" placeholder="jean@mail.com"></div>
    </div>
    <div class="slabel">Mes disponibilités</div>
    <div id="r-dates-section"></div>
    <div class="form-actions">
      <button class="pill pill-o" onclick="closeModal('modal-respond')">Annuler</button>
      <button class="pill pill-g" onclick="submitResponse()">✅ Envoyer</button>
    </div>
  </div>
</div>

<!-- MODAL ADMIN -->
<div id="modal-admin" class="modal-bg">
  <div class="modal">
    <h2>🔑 Accès admin</h2>
    <label>Mot de passe</label>
    <input type="password" id="admin-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkAdmin()">
    <div style="font-size:0.71rem;color:var(--muted);margin-top:7px">Par défaut : <code style="color:var(--g);background:rgba(46,204,113,.1);padding:2px 6px;border-radius:4px">jura2026</code></div>
    <div class="form-actions">
      <button class="pill pill-o" onclick="closeModal('modal-admin')">Annuler</button>
      <button class="pill pill-g" onclick="checkAdmin()">Entrer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const ADMIN_PW='jura2026',BLOB_BASE='https://jsonblob.com/api/jsonBlob',BKEY='jura_blob_id';
let isAdmin=false,editingId=null,respondEvId=null,data={events:[]},rState={};

async function getBid(){let id=localStorage.getItem(BKEY);if(id)return id;const r=await fetch(BLOB_BASE,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({events:[],v:1})});const loc=(r.headers.get('location')||'').split('/').pop();if(loc){localStorage.setItem(BKEY,loc);return loc;}throw new Error('Stockage en ligne indisponible');}
async function load(){const id=await getBid();return(await fetch(`${BLOB_BASE}/${id}`,{headers:{Accept:'application/json'}})).json();}
async function persist(d){const id=await getBid();await fetch(`${BLOB_BASE}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)});}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function T(msg,err=false){const el=document.getElementById('toast');el.textContent=msg;el.className='toast '+(err?'err':'ok');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000);}
function fd(date,time){if(!date)return'?';const d=new Date(date+'T00:00');return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})+(time?' '+time:'');}
function O(id){document.getElementById(id).classList.add('open');}
function C(id){document.getElementById(id).classList.remove('open');}

function toggleAdmin(){if(isAdmin){isAdmin=false;document.getElementById('admin-bar').style.display='none';render();return;}document.getElementById('admin-pw').value='';O('modal-admin');}
function checkAdmin(){if(document.getElementById('admin-pw').value===ADMIN_PW){isAdmin=true;C('modal-admin');document.getElementById('admin-bar').style.display='flex';T('✅ Mode admin activé !');render();}else{document.getElementById('admin-pw').style.borderColor='var(--red)';setTimeout(()=>document.getElementById('admin-pw').style.borderColor='var(--border)',1500);}}

function openCreate(id=null){
  editingId=id;document.getElementById('modal-title').textContent=id?"✏️ Modifier l'événement":'✨ Nouvel événement';
  document.getElementById('dates-list').innerHTML='';
  if(id){const ev=data.events.find(e=>e.id===id);if(ev){document.getElementById('f-emoji').value=ev.emoji||'🎉';document.getElementById('f-title').value=ev.title;document.getElementById('f-desc').value=ev.desc||'';document.getElementById('f-location').value=ev.location||'';document.getElementById('f-capacity').value=ev.capacity||0;(ev.dates||[]).forEach(d=>addDateRow(d.date,d.dateEnd,d.time));}}
  else{document.getElementById('f-emoji').value='🎉';['f-title','f-desc','f-location','f-capacity'].forEach(x=>document.getElementById(x).value='');addDateRow();}
  O('modal-event');
}
function addDateRow(date='',de='',time=''){
  const r=document.createElement('div');r.className='date-row';
  r.innerHTML=`<input type="date" value="${date}" title="Date début"><input type="date" value="${de}" title="Date fin (optionnel)"><input type="time" value="${time}" style="width:90px"><button class="pill pill-r" style="padding:4px 9px;font-size:0.7rem" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('dates-list').appendChild(r);
}
async function saveEvent(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){T('⚠️ Titre obligatoire',true);return;}
  const dates=[];
  document.querySelectorAll('#dates-list .date-row').forEach(row=>{const[d,de,t]=row.querySelectorAll('input');if(d.value)dates.push({id:uid(),date:d.value,dateEnd:de.value,time:t.value,responses:[]});});
  if(!dates.length){T('⚠️ Ajoutez au moins une date',true);return;}
  if(editingId){
    const idx=data.events.findIndex(e=>e.id===editingId);
    if(idx>=0){const ex=data.events[idx].dates||[];dates.forEach(d=>{const p=ex.find(e=>e.date===d.date);if(p)d.responses=p.responses;});data.events[idx]={...data.events[idx],emoji:document.getElementById('f-emoji').value||'🎉',title,desc:document.getElementById('f-desc').value,location:document.getElementById('f-location').value,capacity:parseInt(document.getElementById('f-capacity').value)||0,dates};}
  }else{data.events.push({id:uid(),emoji:document.getElementById('f-emoji').value||'🎉',title,desc:document.getElementById('f-desc').value,location:document.getElementById('f-location').value,capacity:parseInt(document.getElementById('f-capacity').value)||0,dates,createdAt:Date.now()});}
  C('modal-event');T('💾 Sauvegarde…');await persist(data);render();T(editingId?'✅ Mis à jour !':'🎉 Événement créé !');
}
async function delEvent(id){if(!confirm('Supprimer ?'))return;data.events=data.events.filter(e=>e.id!==id);await persist(data);render();T('🗑️ Supprimé');}
function toggleBody(id){document.getElementById('body-'+id).classList.toggle('open');}
function copyUrl(u){navigator.clipboard.writeText(u).then(()=>T('🔗 Lien copié !'));}

function gcal(title,date,time,loc){const dt=date.replace(/-/g,''),t=(time||'').replace(':','');const s=t?`${dt}T${t}00`:dt,e=t?`${dt}T${String(parseInt(t.slice(0,2))+2).padStart(2,'0')}${t.slice(2)}00`:dt;return'https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:title,dates:s+'/'+e,location:loc||''});}
function ics(title,date,time,loc){const d=new Date(date+'T'+(time||'00:00')+':00'),e2=new Date(d);e2.setHours(e2.getHours()+2);const fmt=x=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';const txt='BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:'+fmt(d)+'\nDTEND:'+fmt(e2)+'\nSUMMARY:'+title+'\nLOCATION:'+(loc||'')+'\nEND:VEVENT\nEND:VCALENDAR';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/calendar'}));a.download=title.replace(/\s+/g,'-')+'.ics';a.click();}

function openRespond(evId){
  respondEvId=evId;rState={};
  const ev=data.events.find(e=>e.id===evId);if(!ev)return;
  ['r-first','r-last','r-family','r-email'].forEach(id=>document.getElementById(id).value='');
  const sec=document.getElementById('r-dates-section');sec.innerHTML='';
  ev.dates.forEach(d=>{
    rState[d.id]={avail:'',sleep:false,nb:1};
    const label=d.dateEnd?`${fd(d.date,d.time)} → ${fd(d.dateEnd)}`:`${fd(d.date,d.time)}`;
    const div=document.createElement('div');div.className='drr';div.id='drr-'+d.id;
    div.innerHTML=`<div class="drr-label">📅 ${label}</div>
      <div class="abtns">
        <button class="abtn yes" onclick="setAv('${d.id}','yes',this)">✅ Présent</button>
        <button class="abtn maybe" onclick="setAv('${d.id}','maybe',this)">🤔 Peut-être</button>
        <button class="abtn no" onclick="setAv('${d.id}','no',this)">❌ Absent</button>
      </div>
      <div class="extra">
        <label>👥 Personnes : <input type="number" min="1" max="30" value="1" id="nb-${d.id}" onchange="rState['${d.id}'].nb=parseInt(this.value)||1"></label>
        <label><input type="checkbox" id="sl-${d.id}" onchange="rState['${d.id}'].sleep=this.checked"> 🛏️ Dort sur place</label>
      </div>`;
    sec.appendChild(div);
  });
  O('modal-respond');
}
function setAv(did,val,btn){rState[did].avail=val;const row=document.getElementById('drr-'+did);row.querySelectorAll('.abtn').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');row.classList.add('answered');}
async function submitResponse(){
  const fn=document.getElementById('r-first').value.trim(),ln=document.getElementById('r-last').value.trim();
  if(!fn||!ln){T('⚠️ Prénom et nom obligatoires',true);return;}
  if(!Object.values(rState).some(r=>r.avail)){T('⚠️ Réponds à au moins une date',true);return;}
  const ev=data.events.find(e=>e.id===respondEvId);if(!ev)return;
  const name=fn+' '+ln,family=document.getElementById('r-family').value.trim()||name,email=document.getElementById('r-email').value.trim();
  ev.dates.forEach(d=>{d.responses=d.responses.filter(r=>r.name.toLowerCase()!==name.toLowerCase());});
  ev.dates.forEach(d=>{const rs=rState[d.id];if(rs&&rs.avail)d.responses.push({id:uid(),name,family,email,avail:rs.avail,sleep:rs.sleep,nb:rs.nb||1,at:Date.now()});});
  C('modal-respond');T('💾 Envoi…');await persist(data);render();T(`✅ ${fn}, ta réponse est bien enregistrée !`);
}
async function delResp(evId,dateId,rid){const ev=data.events.find(e=>e.id===evId);const d=ev?.dates?.find(x=>x.id===dateId);if(d)d.responses=d.responses.filter(r=>r.id!==rid);await persist(data);render();T('🗑️ Réponse supprimée');}

function render(){
  const list=document.getElementById('events-list'),empty=document.getElementById('empty');
  document.getElementById('loading').style.display='none';
  if(!data.events.length){list.style.display='none';empty.style.display='block';return;}
  empty.style.display='none';list.style.display='block';
  const url=window.location.href.split('?')[0];
  list.innerHTML=data.events.map(ev=>{
    const names=[...new Set(ev.dates.flatMap(d=>d.responses.map(r=>r.name)))];
    const totalYes=ev.dates.reduce((s,d)=>s+d.responses.filter(r=>r.avail==='yes').reduce((a,r)=>a+r.nb,0),0);
    const thead='<tr><th class="nc">Participant</th>'+ev.dates.map(d=>{const y=d.responses.filter(r=>r.avail==='yes').length,m=d.responses.filter(r=>r.avail==='maybe').length,n=d.responses.filter(r=>r.avail==='no').length;const lbl=d.dateEnd?`${fd(d.date,d.time)}→${fd(d.dateEnd)}`:`${fd(d.date,d.time)}`;return`<th>${lbl}<br><span style="font-weight:400;color:var(--muted)">${y}✅${m}🤔${n}❌</span></th>`;}).join('')+'<th>👥</th></tr>';
    const trows=names.map(name=>{
      const cells=ev.dates.map(d=>{const r=d.responses.find(x=>x.name===name);if(!r)return'<td style="color:var(--border)">—</td>';const ic=r.avail==='yes'?'<span class="cy">✅</span>':r.avail==='maybe'?'<span class="cm">🤔</span>':'<span class="cn">❌</span>';const nb=r.nb>1?`<span style="font-size:0.68rem;color:var(--muted)">×${r.nb}</span>`:'';const sl=r.sleep?'<span class="stag">🛏️</span>':'';const del=isAdmin?`<button class="del-btn" onclick="delResp('${ev.id}','${d.id}','${r.id}')">✕</button>`:'';return`<td>${ic}${nb}${sl}${del}</td>`;}).join('');
      const fr=ev.dates.flatMap(d=>d.responses).find(r=>r.name===name);
      const ny=ev.dates.reduce((s,d)=>{const r=d.responses.find(x=>x.name===name&&x.avail==='yes');return s+(r?r.nb:0);},0);
      return`<tr><td class="nc"><div class="pname">${name}</div>${fr?.family&&fr.family!==name?`<div class="pfam">${fr.family}</div>`:''}</td>${cells}<td style="color:var(--g);font-weight:700">${ny||'—'}</td></tr>`;
    }).join('');
    const ttot='<tr class="totrow"><td class="nc">Totaux</td>'+ev.dates.map(d=>{const yp=d.responses.filter(r=>r.avail==='yes').reduce((s,r)=>s+r.nb,0),mp=d.responses.filter(r=>r.avail==='maybe').reduce((s,r)=>s+r.nb,0),sl=d.responses.filter(r=>r.sleep&&(r.avail==='yes'||r.avail==='maybe')).length,over=ev.capacity&&sl>ev.capacity;return`<td>${yp?`<span class="cy">${yp}✅</span> `:''}${mp?`<span class="cm">${mp}🤔</span>`:''} ${sl?`<br><small style="color:${over?'var(--red)':'var(--blue)'}">🛏️${sl}${ev.capacity?'/'+ev.capacity:''}</small>`:''}</td>`;}).join('')+'<td></td></tr>';
    const calbts=ev.dates.map(d=>{const lbl=d.dateEnd?`${fd(d.date,d.time)} → ${fd(d.dateEnd)}`:`${fd(d.date,d.time)}`;return`<div class="cal-row2"><span class="cal-lbl">${lbl}</span><a class="cbtn" href="${gcal(ev.title,d.date,d.time,ev.location)}" target="_blank">📅 Google</a> <button class="cbtn ics" onclick="ics('${ev.title.replace(/'/g,"\'")}','${d.date}','${d.time||''}','${(ev.location||'').replace(/'/g,"\'")}')">📥 .ics</button></div>`;}).join('');
    return`<div class="event-card">
      <div class="event-header" onclick="toggleBody('${ev.id}')">
        <div class="event-emoji">${ev.emoji||'🎉'}</div>
        <div style="flex:1;min-width:0">
          <div class="event-title">${ev.title}</div>
          <div class="event-tags">
            ${ev.location?`<span class="tag b">📍${ev.location}</span>`:''}
            <span class="tag g">👥 ${totalYes} confirmé(s)</span>
            <span class="tag">${ev.dates.length} date(s)</span>
            ${ev.capacity?`<span class="tag o">🛏️ max ${ev.capacity}</span>`:''}
          </div>
        </div>
        <div class="event-actions" onclick="event.stopPropagation()">
          <button class="pill pill-g" style="padding:7px 14px" onclick="openRespond('${ev.id}')">✋ Répondre</button>
          ${isAdmin?`<button class="pill pill-o" style="padding:7px 10px" onclick="openCreate('${ev.id}')">✏️</button><button class="pill pill-r" style="padding:7px 10px" onclick="delEvent('${ev.id}')">🗑️</button>`:''}
        </div>
      </div>
      <div class="event-body" id="body-${ev.id}">
        ${ev.desc?`<div style="font-size:0.82rem;color:var(--muted);margin:14px 0 0;line-height:1.6;background:var(--card2);padding:12px;border-radius:10px;border:1px solid var(--border)">${ev.desc}</div>`:''}
        <div class="share-row">
          <span style="font-size:0.8rem">🔗</span>
          <span class="share-url">${url}</span>
          <button class="copy-btn" onclick="copyUrl('${url}')">Copier</button>
        </div>
        ${names.length?`<div class="doodle-wrap"><table class="doodle-table">${thead}${trows}${ttot}</table></div>`:'<div style="font-size:0.8rem;color:var(--muted);text-align:center;padding:16px;background:var(--card2);border-radius:10px;margin-top:14px">Aucune réponse — partagez le lien !</div>'}
        ${calbts?`<div class="cal-section">${calbts}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

async function init(){
  try{data=await load();if(!data.events)data.events=[];render();}
  catch(e){document.getElementById('loading').innerHTML=`<div style="color:var(--red);padding:20px;text-align:center">❌ ${e.message}</div>`;}
}
init();
setInterval(async()=>{try{const f=await load();if(JSON.stringify(f)!==JSON.stringify(data)){data=f;if(!data.events)data.events=[];render();}}catch(e){}},30000);
</script>
</body>
</html>
