<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎉 Jura Events — Doodle</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
    header{background:linear-gradient(135deg,#16213e,#1a6b3a);padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:2px solid #2ecc71;position:sticky;top:0;z-index:100}
    header h1{font-size:1.2rem;color:#fff}
    header .sub{font-size:0.73rem;color:#aaa}
    .hbtn{background:#2ecc71;color:#111;padding:5px 13px;border-radius:20px;font-size:0.74rem;margin-left:auto;font-weight:bold;cursor:pointer;border:none;white-space:nowrap}
    .hbtn:hover{background:#27ae60}
    .container{max-width:900px;margin:0 auto;padding:20px 14px}
    .btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:0.82rem;font-weight:bold;transition:all .2s}
    .btn-g{background:#2ecc71;color:#111}.btn-g:hover{background:#27ae60}
    .btn-o{background:transparent;color:#2ecc71;border:1px solid #2ecc71}.btn-o:hover{background:#2ecc71;color:#111}
    .btn-r{background:#e74c3c;color:#fff}.btn-r:hover{background:#c0392b}
    .btn-sm{padding:4px 10px;font-size:0.73rem}
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;align-items:center;justify-content:center;padding:14px}
    .modal-bg.open{display:flex}
    .modal{background:#16213e;border-radius:14px;padding:22px;width:100%;max-width:560px;border:1px solid #2ecc71;max-height:92vh;overflow-y:auto}
    .modal h2{font-size:1.05rem;color:#2ecc71;margin-bottom:14px}
    label{font-size:0.78rem;color:#aaa;display:block;margin:10px 0 3px}
    input,textarea,select{width:100%;background:#0f3460;border:1px solid #333;border-radius:7px;padding:8px 11px;color:#eee;font-size:0.82rem;outline:none}
    input:focus,textarea:focus{border-color:#2ecc71}
    .row2{display:flex;gap:8px}
    .row2>*{flex:1}
    .date-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
    .date-row input{flex:1}
    .add-date-btn{margin-top:6px;font-size:0.76rem;color:#2ecc71;background:none;border:1px dashed #2ecc71;border-radius:6px;padding:5px 10px;cursor:pointer;width:100%}
    .form-actions{display:flex;gap:8px;margin-top:18px;justify-content:flex-end}

    /* EVENT CARD */
    .event-card{background:#16213e;border-radius:12px;border-left:4px solid #2ecc71;margin-bottom:16px;overflow:hidden}
    .event-header{padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:10px}
    .event-emoji{font-size:1.9em;flex-shrink:0}
    .event-info{flex:1;min-width:0}
    .event-title{font-size:1rem;font-weight:bold;color:#fff}
    .event-meta{font-size:0.72rem;color:#888;margin-top:2px}
    .event-btns{display:flex;gap:6px;flex-shrink:0}
    .event-body{display:none;padding:0 14px 16px}
    .event-body.open{display:block}
    .event-desc{font-size:0.8rem;color:#bbb;margin-bottom:12px;background:#0f3460;padding:9px;border-radius:7px;line-height:1.5}

    /* SHARE */
    .share-box{background:#0f3460;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .share-url{font-size:0.72rem;color:#2ecc71;flex:1;word-break:break-all}
    .share-copy{font-size:0.72rem;background:#2ecc71;color:#111;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-weight:bold;white-space:nowrap}

    /* TABLEAU DOODLE */
    .doodle-wrap{overflow-x:auto;margin-bottom:10px}
    .doodle-table{border-collapse:collapse;width:100%;min-width:400px}
    .doodle-table th{background:#0f3460;color:#2ecc71;font-size:0.75rem;padding:7px 10px;text-align:center;border:1px solid #1a1a2e;white-space:nowrap}
    .doodle-table th.name-col{text-align:left;min-width:120px}
    .doodle-table td{border:1px solid #1a1a2e;padding:6px 8px;text-align:center;font-size:0.78rem;vertical-align:middle}
    .doodle-table td.name-col{text-align:left;color:#ccc}
    .doodle-table tr:nth-child(even){background:rgba(15,52,96,.3)}
    .cell-yes{color:#2ecc71;font-size:1.1em}
    .cell-no{color:#e74c3c;font-size:1.1em}
    .cell-maybe{color:#f39c12;font-size:1.1em}
    .totals td{background:#0f3460;font-weight:bold;font-size:0.78rem;color:#2ecc71}
    .totals td.name-col{color:#888}
    .sleep-badge{font-size:0.65rem;padding:1px 5px;border-radius:8px;margin-left:4px}
    .sleep-yes{background:#1a6b3a;color:#2ecc71}
    .sleep-no{background:#2c1a1a;color:#e74c3c}

    /* RÉPONDRE */
    .respond-section{margin-top:12px}
    .respond-section h4{font-size:0.85rem;color:#2ecc71;margin-bottom:8px}
    .date-response-row{background:#0f3460;border-radius:8px;padding:10px;margin-bottom:7px}
    .date-response-label{font-size:0.82rem;color:#eee;font-weight:bold;margin-bottom:6px}
    .response-btns{display:flex;gap:6px;flex-wrap:wrap}
    .rbtn{padding:5px 12px;border-radius:6px;border:2px solid transparent;cursor:pointer;font-size:0.78rem;font-weight:bold;background:#1a1a2e;color:#888;transition:all .2s}
    .rbtn.yes{border-color:#2ecc71;color:#2ecc71}.rbtn.yes.sel{background:#2ecc71;color:#111}
    .rbtn.no{border-color:#e74c3c;color:#e74c3c}.rbtn.no.sel{background:#e74c3c;color:#fff}
    .rbtn.maybe{border-color:#f39c12;color:#f39c12}.rbtn.maybe.sel{background:#f39c12;color:#111}
    .sleep-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:0.78rem;color:#aaa}
    .sleep-row input[type=checkbox]{width:auto;accent-color:#2ecc71}
    .nb-row{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:0.78rem;color:#aaa}
    .nb-row input[type=number]{width:70px}

    /* CAL */
    .cal-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
    .cal-btn{font-size:0.7rem;padding:3px 9px;border-radius:6px;border:1px solid #3498db;color:#3498db;background:none;cursor:pointer;text-decoration:none;display:inline-block}
    .cal-btn:hover{background:#3498db;color:#fff}
    .cal-ics{border-color:#9b59b6;color:#9b59b6}.cal-ics:hover{background:#9b59b6;color:#fff}

    .empty{text-align:center;padding:60px 20px;color:#555}
    .empty .big{font-size:3em;margin-bottom:12px}
    .admin-bar{background:#0f3460;padding:8px 20px;font-size:0.76rem;color:#888;display:flex;align-items:center;gap:10px;border-bottom:1px solid #333}
    .admin-bar span{color:#2ecc71}
    .toast{position:fixed;bottom:20px;right:20px;background:#2ecc71;color:#111;padding:10px 18px;border-radius:10px;font-size:0.82rem;font-weight:bold;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:280px}
    .toast.show{opacity:1}
    .loading{text-align:center;padding:40px;color:#888;font-size:0.85rem}
    .spinner{display:inline-block;width:20px;height:20px;border:3px solid #333;border-top-color:#2ecc71;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(max-width:480px){.event-btns{flex-direction:column}.event-header{flex-wrap:wrap}}
  </style>
</head>
<body>

<header>
  <div style="font-size:1.8em">🎉</div>
  <div>
    <h1>Jura Events</h1>
    <div class="sub">Doodle & inscriptions</div>
  </div>
  <button class="hbtn" onclick="toggleAdmin()">⚙️ Admin</button>
</header>

<div id="admin-bar" class="admin-bar" style="display:none">
  ⚙️ Mode admin — <span>Créer et gérer les événements</span>
  <button class="btn btn-sm btn-g" onclick="openCreate()" style="margin-left:auto">+ Nouvel événement</button>
</div>

<div class="container">
  <div id="loading" class="loading"><span class="spinner"></span>Chargement…</div>
  <div id="events-list" style="display:none"></div>
  <div id="empty" class="empty" style="display:none">
    <div class="big">📅</div>
    <p>Aucun événement pour l'instant.</p>
    <p style="margin-top:6px;font-size:0.78rem">Active le mode admin pour en créer un !</p>
  </div>
</div>

<!-- MODAL CREATE/EDIT -->
<div id="modal-event" class="modal-bg">
  <div class="modal">
    <h2 id="modal-title">✨ Nouvel événement</h2>
    <div class="row2">
      <div><label>Emoji</label><input id="f-emoji" maxlength="4" value="🎉" style="width:70px"></div>
      <div><label>Titre *</label><input id="f-title" placeholder="Ex: Week-end au chalet"></div>
    </div>
    <label>Description</label><textarea id="f-desc" rows="2" placeholder="Infos, programme, détails…"></textarea>
    <label>Lieu</label><input id="f-location" placeholder="Ex: Chalet des Bellins, Morez">
    <label>Capacité max sur place (nuitées)</label><input id="f-capacity" type="number" min="0" placeholder="Ex: 12 (0 = illimité)" style="width:160px">
    <label>Dates proposées *</label>
    <div class="dates-list" id="dates-list"></div>
    <button class="add-date-btn" onclick="addDateRow()">+ Ajouter une date / période</button>
    <div class="form-actions">
      <button class="btn btn-o" onclick="closeModal('modal-event')">Annuler</button>
      <button class="btn btn-g" onclick="saveEvent()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<!-- MODAL RÉPONDRE -->
<div id="modal-respond" class="modal-bg">
  <div class="modal">
    <h2>✋ Je réponds</h2>
    <div class="row2">
      <div><label>Prénom *</label><input id="r-first" placeholder="Jean"></div>
      <div><label>Nom *</label><input id="r-last" placeholder="Dupont"></div>
    </div>
    <label>Famille / Groupe</label><input id="r-family" placeholder="Ex: Famille Dupont, Les Chevalier…">
    <label>Email (optionnel)</label><input id="r-email" type="email" placeholder="jean@exemple.com">
    <div id="r-dates-section"></div>
    <div class="form-actions">
      <button class="btn btn-o" onclick="closeModal('modal-respond')">Annuler</button>
      <button class="btn btn-g" onclick="submitResponse()">✅ Envoyer ma réponse</button>
    </div>
  </div>
</div>

<!-- MODAL ADMIN -->
<div id="modal-admin" class="modal-bg">
  <div class="modal">
    <h2>🔑 Accès administrateur</h2>
    <label>Mot de passe</label>
    <input type="password" id="admin-pw" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')checkAdmin()">
    <div style="font-size:0.72rem;color:#666;margin-top:5px">Par défaut : <code style="color:#2ecc71">jura2026</code></div>
    <div class="form-actions">
      <button class="btn btn-o" onclick="closeModal('modal-admin')">Annuler</button>
      <button class="btn btn-g" onclick="checkAdmin()">Entrer</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const ADMIN_PW = 'jura2026';
const BLOB_BASE = 'https://jsonblob.com/api/jsonBlob';
const BLOB_ID_KEY = 'jura_blob_id';
let isAdmin = false, editingId = null, respondEventId = null;
let appData = {events:[]};
// Temporary state for response form
let responseState = {};

// ── STORAGE ───────────────────────────────────────────────
async function getBlobId() {
  let id = localStorage.getItem(BLOB_ID_KEY);
  if (id) return id;
  const res = await fetch(BLOB_BASE, {
    method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({events:[], createdAt:Date.now()})
  });
  const loc = res.headers.get('location')||res.headers.get('Location')||'';
  const newId = loc.split('/').pop();
  if (newId) { localStorage.setItem(BLOB_ID_KEY, newId); return newId; }
  throw new Error('Impossible de créer le stockage en ligne');
}
async function loadData() {
  const id = await getBlobId();
  const res = await fetch(`${BLOB_BASE}/${id}`,{headers:{Accept:'application/json'}});
  return res.json();
}
async function saveData(data) {
  const id = await getBlobId();
  await fetch(`${BLOB_BASE}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)});
}

// ── UTILS ─────────────────────────────────────────────────
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function toast(msg, err=false) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.background = err?'#e74c3c':'#2ecc71'; el.style.color = err?'#fff':'#111';
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 2800);
}
function fmtDate(date, time) {
  if (!date) return '?';
  const d = new Date(date+'T00:00');
  return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}) + (time?' '+time:'');
}
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── ADMIN ─────────────────────────────────────────────────
function toggleAdmin() {
  if (isAdmin) { isAdmin=false; document.getElementById('admin-bar').style.display='none'; render(); return; }
  document.getElementById('admin-pw').value=''; openModal('modal-admin');
}
function checkAdmin() {
  if (document.getElementById('admin-pw').value===ADMIN_PW) {
    isAdmin=true; closeModal('modal-admin');
    document.getElementById('admin-bar').style.display='flex';
    toast('✅ Mode admin activé !'); render();
  } else {
    document.getElementById('admin-pw').style.borderColor='#e74c3c';
    setTimeout(()=>document.getElementById('admin-pw').style.borderColor='#333',1500);
  }
}

// ── CREATE ────────────────────────────────────────────────
function openCreate(evId=null) {
  editingId=evId;
  document.getElementById('modal-title').textContent = evId?'✏️ Modifier l\'événement':'✨ Nouvel événement';
  document.getElementById('dates-list').innerHTML='';
  if (evId) {
    const ev=appData.events.find(e=>e.id===evId);
    if (ev) {
      document.getElementById('f-emoji').value=ev.emoji||'🎉';
      document.getElementById('f-title').value=ev.title;
      document.getElementById('f-desc').value=ev.desc||'';
      document.getElementById('f-location').value=ev.location||'';
      document.getElementById('f-capacity').value=ev.capacity||0;
      (ev.dates||[]).forEach(d=>addDateRow(d.date,d.dateEnd,d.time));
    }
  } else {
    document.getElementById('f-emoji').value='🎉';
    ['f-title','f-desc','f-location'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('f-capacity').value='';
    addDateRow();
  }
  openModal('modal-event');
}

function addDateRow(date='',dateEnd='',time='') {
  const row=document.createElement('div'); row.className='date-row';
  row.innerHTML=`<input type="date" value="${date}" title="Date début"><input type="date" value="${dateEnd}" title="Date fin (optionnel)" style="width:140px"><input type="time" value="${time}" style="width:100px"><button class="btn btn-r btn-sm" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('dates-list').appendChild(row);
}

async function saveEvent() {
  const title=document.getElementById('f-title').value.trim();
  if (!title) { toast('⚠️ Titre obligatoire',true); return; }
  const dates=[];
  document.querySelectorAll('#dates-list .date-row').forEach(row=>{
    const [d,de,t]=row.querySelectorAll('input');
    if (d.value) dates.push({id:uid(),date:d.value,dateEnd:de.value,time:t.value,responses:[]});
  });
  if (!dates.length) { toast('⚠️ Ajoutez au moins une date',true); return; }
  if (editingId) {
    const idx=appData.events.findIndex(e=>e.id===editingId);
    if (idx>=0) {
      const existing=appData.events[idx].dates||[];
      dates.forEach(d=>{ const p=existing.find(e=>e.date===d.date); if(p) d.responses=p.responses; });
      appData.events[idx]={...appData.events[idx],emoji:document.getElementById('f-emoji').value||'🎉',title,desc:document.getElementById('f-desc').value,location:document.getElementById('f-location').value,capacity:parseInt(document.getElementById('f-capacity').value)||0,dates};
    }
  } else {
    appData.events.push({id:uid(),emoji:document.getElementById('f-emoji').value||'🎉',title,desc:document.getElementById('f-desc').value,location:document.getElementById('f-location').value,capacity:parseInt(document.getElementById('f-capacity').value)||0,dates,createdAt:Date.now()});
  }
  closeModal('modal-event'); toast('💾 Sauvegarde…');
  await saveData(appData); render(); toast(editingId?'✅ Mis à jour !':'🎉 Événement créé !');
}

async function deleteEvent(id) {
  if (!confirm('Supprimer cet événement ?')) return;
  appData.events=appData.events.filter(e=>e.id!==id);
  await saveData(appData); render(); toast('🗑️ Supprimé');
}

// ── RESPOND ───────────────────────────────────────────────
function openRespond(evId) {
  respondEventId=evId;
  responseState={};
  const ev=appData.events.find(e=>e.id===evId);
  if (!ev) return;
  ['r-first','r-last','r-family','r-email'].forEach(id=>document.getElementById(id).value='');
  const sec=document.getElementById('r-dates-section');
  sec.innerHTML='<div style="margin-top:14px;font-size:0.82rem;color:#2ecc71;font-weight:bold;margin-bottom:8px">📅 Tes disponibilités par date</div>';
  ev.dates.forEach(d=>{
    responseState[d.id]={avail:'',sleep:false,nb:1};
    const label=d.dateEnd?`${fmtDate(d.date,d.time)} → ${fmtDate(d.dateEnd)}`:`${fmtDate(d.date,d.time)}`;
    sec.innerHTML+=`<div class="date-response-row" id="drr-${d.id}">
      <div class="date-response-label">📅 ${label}</div>
      <div class="response-btns">
        <button class="rbtn yes" onclick="setAvail('${d.id}','yes',this)">✅ Présent</button>
        <button class="rbtn maybe" onclick="setAvail('${d.id}','maybe',this)">🤔 Peut-être</button>
        <button class="rbtn no" onclick="setAvail('${d.id}','no',this)">❌ Absent</button>
      </div>
      <div class="nb-row">
        👥 Nombre de personnes (famille) :
        <input type="number" min="1" max="20" value="1" id="nb-${d.id}" style="width:70px" onchange="responseState['${d.id}'].nb=parseInt(this.value)||1">
      </div>
      <div class="sleep-row">
        <input type="checkbox" id="sleep-${d.id}" onchange="responseState['${d.id}'].sleep=this.checked">
        <label for="sleep-${d.id}">🛏️ Je dors sur place</label>
      </div>
    </div>`;
  });
  openModal('modal-respond');
}

function setAvail(dateId, val, btn) {
  responseState[dateId].avail=val;
  const row=document.getElementById('drr-'+dateId);
  row.querySelectorAll('.rbtn').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
}

async function submitResponse() {
  const fn=document.getElementById('r-first').value.trim();
  const ln=document.getElementById('r-last').value.trim();
  if (!fn||!ln) { toast('⚠️ Prénom et nom obligatoires',true); return; }
  const hasAny = Object.values(responseState).some(r=>r.avail!=='');
  if (!hasAny) { toast('⚠️ Réponds à au moins une date',true); return; }
  const ev=appData.events.find(e=>e.id===respondEventId);
  if (!ev) return;
  const name=fn+' '+ln;
  const family=document.getElementById('r-family').value.trim()||name;
  const email=document.getElementById('r-email').value.trim();
  // Remove previous response from same person
  ev.dates.forEach(d=>{ d.responses=d.responses.filter(r=>r.name.toLowerCase()!==name.toLowerCase()); });
  // Add new responses
  ev.dates.forEach(d=>{
    const rs=responseState[d.id];
    if (rs && rs.avail) {
      d.responses.push({id:uid(), name, family, email, avail:rs.avail, sleep:rs.sleep, nb:rs.nb||1, at:Date.now()});
    }
  });
  closeModal('modal-respond'); toast('💾 Envoi…');
  await saveData(appData); render(); toast(`✅ ${fn}, ta réponse est enregistrée !`);
}

async function deleteResponse(evId, dateId, respId) {
  const ev=appData.events.find(e=>e.id===evId);
  const d=ev?.dates?.find(x=>x.id===dateId);
  if (d) d.responses=d.responses.filter(r=>r.id!==respId);
  await saveData(appData); render(); toast('🗑️ Réponse supprimée');
}

function toggleBody(id) { document.getElementById('body-'+id).classList.toggle('open'); }

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(()=>toast('🔗 Lien copié !')).catch(()=>toast('Copie manuelle : '+url));
}

// ── CALENDAR ──────────────────────────────────────────────
function gcalUrl(title,date,time,location) {
  const dt=date.replace(/-/g,''), t=(time||'').replace(':','');
  const s=t?`${dt}T${t}00`:dt, e=t?`${dt}T${String(parseInt(t.slice(0,2))+2).padStart(2,'0')}${t.slice(2)}00`:dt;
  return 'https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:title,dates:s+'/'+e,location:location||''});
}
function dlICS(title,date,time,location) {
  const d=new Date(date+'T'+(time||'00:00')+':00'), e2=new Date(d); e2.setHours(e2.getHours()+2);
  const fmt=x=>x.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nDTSTART:${fmt(d)}\nDTEND:${fmt(e2)}\nSUMMARY:${title}\nLOCATION:${location||''}\nEND:VEVENT\nEND:VCALENDAR`;
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download=title.replace(/\s+/g,'-')+'.ics'; a.click();
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  const list=document.getElementById('events-list'), empty=document.getElementById('empty');
  document.getElementById('loading').style.display='none';
  if (!appData.events.length) { list.style.display='none'; empty.style.display='block'; return; }
  empty.style.display='none'; list.style.display='block';
  const pageUrl=window.location.href.split('?')[0];
  list.innerHTML=appData.events.map(ev=>{
    // Résumé participants par date
    const datesHtml=ev.dates.map(d=>{
      const yes=d.responses.filter(r=>r.avail==='yes');
      const maybe=d.responses.filter(r=>r.avail==='maybe');
      const no=d.responses.filter(r=>r.avail==='no');
      const totalPeople=yes.reduce((s,r)=>s+r.nb,0)+maybe.reduce((s,r)=>s+r.nb,0);
      const sleeping=yes.filter(r=>r.sleep).length+maybe.filter(r=>r.sleep).length;
      const label=d.dateEnd?`${fmtDate(d.date,d.time)} → ${fmtDate(d.dateEnd)}`:`${fmtDate(d.date,d.time)}`;
      return {d,yes,maybe,no,totalPeople,sleeping,label};
    });
    // Toutes les personnes uniques
    const allNames=[...new Set(ev.dates.flatMap(d=>d.responses.map(r=>r.name)))];
    // Tableau doodle
    const tableHead=`<tr><th class="name-col">Participant</th>${ev.dates.map((d,i)=>{
      const info=datesHtml[i];
      return `<th>${info.label}<br><span style="font-size:0.65rem;color:#aaa">${info.yes.length}✅ ${info.maybe.length}🤔 ${info.no.length}❌</span></th>`;
    }).join('')}<th>👥 Total</th></tr>`;
    const tableRows=allNames.map(name=>{
      const cells=ev.dates.map(d=>{
        const r=d.responses.find(x=>x.name===name);
        if (!r) return '<td>—</td>';
        const icon=r.avail==='yes'?'<span class="cell-yes">✅</span>':r.avail==='maybe'?'<span class="cell-maybe">🤔</span>':'<span class="cell-no">❌</span>';
        const nb=r.nb>1?`<span style="font-size:0.7rem;color:#aaa"> ×${r.nb}</span>`:'';
        const sleep=r.sleep?`<span class="sleep-badge sleep-yes">🛏️</span>`:'';
        const del=isAdmin?`<button class="reg-del" onclick="deleteResponse('${ev.id}','${d.id}','${r.id}')" style="background:none;border:none;color:#e74c3c;cursor:pointer;font-size:0.75rem">✕</button>`:'';
        return `<td>${icon}${nb}${sleep}${del}</td>`;
      }).join('');
      const firstResp=ev.dates.flatMap(d=>d.responses).find(r=>r.name===name);
      const nbTotal=ev.dates.reduce((s,d)=>{const r=d.responses.find(x=>x.name===name&&x.avail==='yes');return s+(r?r.nb:0);},0);
      return `<tr><td class="name-col">${name}${firstResp?.family&&firstResp.family!==name?`<br><span style="font-size:0.68rem;color:#888">${firstResp.family}</span>`:''}</td>${cells}<td style="color:#2ecc71;font-weight:bold">${nbTotal||'—'}</td></tr>`;
    }).join('');
    // Ligne totaux
    const totalsRow=`<tr class="totals"><td class="name-col">Total présents</td>${ev.dates.map((_,i)=>{
      const info=datesHtml[i];
      return `<td>${info.totalPeople} pers${info.sleeping?`<br><span style="font-size:0.68rem;color:#888">🛏️ ${info.sleeping} dort</span>`:''}${ev.capacity?`<br><span style="font-size:0.68rem;color:${info.sleeping>ev.capacity?'#e74c3c':'#888'}">max ${ev.capacity}</span>`:''}</td>`;
    }).join('')}<td></td></tr>`;
    // Cal buttons pour chaque date
    const calBtns=ev.dates.map(d=>`<div style="margin-bottom:4px;font-size:0.72rem;color:#888">${fmtDate(d.date,d.time)} : <a class="cal-btn" href="${gcalUrl(ev.title,d.date,d.time,ev.location)}" target="_blank">📅 Google</a> <button class="cal-btn cal-ics" onclick="dlICS('${ev.title.replace(/'/g,"\\'")}','${d.date}','${d.time||''}','${(ev.location||'').replace(/'/g,"\\'")}')">📥 .ics</button></div>`).join('');
    const totalYes=ev.dates.reduce((s,d)=>s+d.responses.filter(r=>r.avail==='yes').reduce((a,r)=>a+r.nb,0),0);
    return `<div class="event-card">
      <div class="event-header" onclick="toggleBody('${ev.id}')">
        <span class="event-emoji">${ev.emoji||'🎉'}</span>
        <div class="event-info">
          <div class="event-title">${ev.title}</div>
          <div class="event-meta">${ev.dates.length} date(s) · ${allNames.length} réponse(s) · ${totalYes} personne(s) confirmée(s)${ev.location?' · 📍'+ev.location:''}</div>
        </div>
        <div class="event-btns" onclick="event.stopPropagation()">
          <button class="btn btn-g btn-sm" onclick="openRespond('${ev.id}')">✋ Répondre</button>
          ${isAdmin?`<button class="btn btn-o btn-sm" onclick="openCreate('${ev.id}')">✏️</button><button class="btn btn-r btn-sm" onclick="deleteEvent('${ev.id}')">🗑️</button>`:''}
        </div>
      </div>
      <div class="event-body" id="body-${ev.id}">
        ${ev.desc?`<div class="event-desc">${ev.desc}</div>`:''}
        <div class="share-box">
          <span style="font-size:0.8rem;color:#888">🔗 Partager :</span>
          <span class="share-url">${pageUrl}</span>
          <button class="share-copy" onclick="copyUrl('${pageUrl}')">Copier</button>
        </div>
        ${allNames.length?`<div class="doodle-wrap"><table class="doodle-table">${tableHead}${tableRows}${totalsRow}</table></div>`:'<div style="font-size:0.8rem;color:#555;margin:8px 0 12px">Aucune réponse pour l\'instant.</div>'}
        <div style="margin-top:10px">${calBtns}</div>
      </div>
    </div>`;
  }).join('');
}

// ── INIT ──────────────────────────────────────────────────
async function init() {
  try {
    appData=await loadData();
    if (!appData.events) appData.events=[];
    render();
  } catch(e) {
    document.getElementById('loading').innerHTML=`<div style="color:#e74c3c;padding:20px">❌ Erreur : ${e.message}</div>`;
  }
}
init();
setInterval(async()=>{
  try {
    const fresh=await loadData();
    if (JSON.stringify(fresh)!==JSON.stringify(appData)) { appData=fresh; if(!appData.events) appData.events=[]; render(); }
  } catch(e){}
}, 30000);
</script>
</body>
</html>
